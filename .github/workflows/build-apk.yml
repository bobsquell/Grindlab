name: Build Relook APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Préparer les fichiers web
        run: |
          mkdir www
          cp -r index.html app.js data.js scan.js sw.js styles.css manifest.webmanifest icons www/

      - name: Installer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Configurer Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "fr.relook.app",
            "appName": "Relook",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Autoriser la caméra
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$f"
          grep -n "CAMERA" "$f"

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: relook-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier une release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
